<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product · Ananya</title>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=playfair-display:400,500,600,700|poppins:300,400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/js/ananya.js"></script>
</head>
<body>
<div id="site-header"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <nav class="text-xs text-stone-400 mb-6" id="crumb"></nav>
  <div id="product-root"></div>

  <section class="mt-16">
    <div class="flex items-end justify-between mb-6"><h2 class="section-title">You May Also Like</h2></div>
    <div id="related" class="grid grid-cols-2 md:grid-cols-4 gap-5"></div>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE_INIT = function () {
  const A = window.Ananya;
  const p = A.catalog.productById(A.qs('id'));
  const root = document.getElementById('product-root');
  if (!p) { root.innerHTML = '<div class="text-center py-20"><p class="font-serif text-2xl text-maroon">Product not found</p><a href="shop.html" class="btn-maroon mt-4">Back to shop</a></div>'; return; }

  const cat = A.catalog.categoryById(p.categoryId);
  const price = A.catalog.effectivePrice(p);
  const onSale = p.salePrice != null && p.salePrice < p.price;
  const off = onSale ? Math.round((1 - p.salePrice / p.price) * 100) : 0;
  document.getElementById('crumb').innerHTML = `<a href="index.html" class="hover:text-gold-dark">Home</a> / <a href="shop.html?cat=${cat.slug}" class="hover:text-gold-dark">${A.esc(cat.name)}</a> / <span class="text-maroon">${A.esc(p.name)}</span>`;
  document.title = p.name + ' · Ananya';

  const imgs = p.images.length ? p.images : ['img/hero-products.png'];

  root.innerHTML = `
  <div class="grid lg:grid-cols-2 gap-10">
    <!-- gallery -->
    <div>
      <div class="card p-6 h-[420px] flex items-center justify-center bg-cream-dark/30 relative">
        ${onSale ? `<span class="badge bg-maroon text-cream absolute top-4 left-4">${off}% OFF</span>` : ''}
        <img id="main-img" src="${imgs[0]}" alt="${A.esc(p.name)}" class="max-h-full max-w-full object-contain">
      </div>
      <div id="thumbs" class="mt-4 flex gap-3">
        ${imgs.map((src, i) => `<button data-thumb="${src}" class="thumb w-20 h-20 rounded-xl border-2 ${i===0?'border-gold':'border-gold/20'} bg-white flex items-center justify-center p-2 hover:border-gold transition"><img src="${src}" class="max-h-full max-w-full object-contain"></button>`).join('')}
      </div>
    </div>
    <!-- info -->
    <div>
      <a href="shop.html?cat=${cat.slug}" class="text-xs uppercase tracking-wide text-gold-dark font-semibold">${A.esc(cat.name)}</a>
      <h1 class="font-serif text-3xl md:text-4xl text-maroon mt-2 leading-tight">${A.esc(p.name)}</h1>
      <div class="flex items-center gap-2 mt-3 text-gold-dark">${A.stars(p.rating)}<span class="text-sm text-stone-500 ml-1">${p.rating.toFixed(1)} · 100+ reviews</span></div>
      <div class="mt-5 flex items-end gap-3">
        <span class="font-serif text-4xl font-bold text-maroon">${A.money(price)}</span>
        ${onSale ? `<span class="text-lg text-stone-400 line-through">${A.money(p.price)}</span><span class="badge bg-green-100 text-green-700 mb-1.5">Save ${A.money(p.price-price)}</span>` : ''}
      </div>
      <p class="text-xs text-stone-400 mt-1">Inclusive of all taxes</p>
      <p class="mt-5 text-stone-600 leading-relaxed">${A.esc(p.description)}</p>

      <div class="mt-6 flex items-center gap-2 text-sm">
        ${p.stock > 0
          ? `<span class="inline-flex items-center gap-1.5 text-green-600 font-medium"><span class="w-2 h-2 rounded-full bg-green-500"></span>In Stock${p.stock<=5?` · only ${p.stock} left`:''}</span>`
          : `<span class="inline-flex items-center gap-1.5 text-red-500 font-medium"><span class="w-2 h-2 rounded-full bg-red-500"></span>Out of Stock</span>`}
      </div>

      <div class="mt-6 flex flex-wrap items-center gap-4">
        <div class="inline-flex items-center border border-gold/40 rounded-full overflow-hidden">
          <button id="qty-dec" class="w-11 h-11 flex items-center justify-center text-maroon hover:bg-cream-dark transition text-xl">−</button>
          <input id="qty" value="1" class="w-12 text-center border-0 focus:ring-0 font-semibold text-maroon" readonly>
          <button id="qty-inc" class="w-11 h-11 flex items-center justify-center text-maroon hover:bg-cream-dark transition text-xl">+</button>
        </div>
        <button id="add-btn" class="btn-maroon px-8 py-3.5 flex-1 sm:flex-none" ${p.stock<=0?'disabled':''}>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
          ADD TO CART
        </button>
        <button id="buy-btn" class="btn-gold px-8 py-3.5" ${p.stock<=0?'disabled':''}>BUY NOW</button>
      </div>

      <div class="mt-8 grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
        ${[['truck','Free Shipping','Over ₹2000'],['refresh','Easy Returns','7-day policy'],['shield','Warranty','Manufacturer'],['lock','Secure','Safe checkout']].map(([ic,t,s])=>`
          <div class="card p-3"><div class="w-9 h-9 rounded-full bg-gold/10 text-gold-dark mx-auto flex items-center justify-center mb-1.5">${icon(ic)}</div><p class="text-[11px] font-semibold text-maroon">${t}</p><p class="text-[10px] text-stone-400">${s}</p></div>`).join('')}
      </div>
    </div>
  </div>`;

  // gallery thumbs
  root.querySelectorAll('[data-thumb]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('main-img').src = b.getAttribute('data-thumb');
    root.querySelectorAll('.thumb').forEach(t => t.classList.replace('border-gold','border-gold/20'));
    b.classList.replace('border-gold/20','border-gold');
  }));

  // qty
  let qty = 1;
  const qtyEl = document.getElementById('qty');
  document.getElementById('qty-inc').addEventListener('click', () => { if (qty < p.stock) { qty++; qtyEl.value = qty; } });
  document.getElementById('qty-dec').addEventListener('click', () => { if (qty > 1) { qty--; qtyEl.value = qty; } });
  document.getElementById('add-btn').addEventListener('click', () => { A.cart.add(p.id, qty); A.toast(qty + ' × added to cart'); });
  document.getElementById('buy-btn').addEventListener('click', () => { A.cart.add(p.id, qty); location.href = 'cart.html'; });

  // related
  const related = A.catalog.byCategory(p.categoryId).filter(x => x.id !== p.id).slice(0, 4);
  const fill = A.catalog.products().filter(x => x.id !== p.id && x.categoryId !== p.categoryId).slice(0, 4);
  document.getElementById('related').innerHTML = (related.concat(fill)).slice(0,4).map(A.productCard).join('');

  function icon(name) {
    const m = {
      truck: 'M9 17a2 2 0 11-4 0 2 2 0 014 0zM20 17a2 2 0 11-4 0 2 2 0 014 0z M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 001 1h2m-3-1V8a1 1 0 011-1h3.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1',
      refresh: 'M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15',
      shield: 'M12 3l7 4v5c0 4.42-3.05 8.02-7 9-3.95-.98-7-4.58-7-9V7l7-4z',
      lock: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z',
    };
    return `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${m[name]}"/></svg>`;
  }
};
</script>
</body>
</html>
