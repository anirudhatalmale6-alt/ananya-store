<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart · Ananya</title>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=playfair-display:400,500,600,700|poppins:300,400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/js/ananya.js"></script>
</head>
<body>
<div id="site-header"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <nav class="text-xs text-stone-400 mb-2"><a href="index.html" class="hover:text-gold-dark">Home</a> / <span class="text-maroon">Shopping Cart</span></nav>
  <h1 class="section-title mb-6">Shopping Cart</h1>
  <div id="cart-root"></div>
</main>

<div id="site-footer"></div>

<script>
window.PAGE_INIT = function () {
  const A = window.Ananya;
  const root = document.getElementById('cart-root');

  function render() {
    const items = A.cart.detailed();
    if (!items.length) {
      root.innerHTML = `<div class="card text-center py-20">
        <div class="w-20 h-20 rounded-full bg-gold/10 mx-auto flex items-center justify-center text-gold-dark mb-4"><svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg></div>
        <p class="font-serif text-2xl text-maroon">Your cart is empty</p>
        <p class="text-sm text-stone-500 mt-1 mb-5">Looks like you haven't added anything yet.</p>
        <a href="shop.html" class="btn-maroon">Continue Shopping</a>
      </div>`;
      return;
    }

    const rows = items.map(i => `
      <div class="flex gap-4 p-4 border-b border-gold/10 last:border-0" data-row="${i.id}">
        <a href="product.html?id=${i.id}" class="w-24 h-24 rounded-xl bg-cream-dark/40 flex items-center justify-center p-2 shrink-0"><img src="${i.image}" class="max-h-full max-w-full object-contain"></a>
        <div class="flex-1 min-w-0">
          <a href="product.html?id=${i.id}" class="font-serif text-maroon hover:text-gold-dark transition line-clamp-2">${A.esc(i.name)}</a>
          <p class="text-sm text-stone-500 mt-1">${A.money(i.price)} each</p>
          <div class="mt-3 flex items-center gap-4">
            <div class="inline-flex items-center border border-gold/40 rounded-full overflow-hidden">
              <button data-dec="${i.id}" class="w-8 h-8 flex items-center justify-center text-maroon hover:bg-cream-dark transition">−</button>
              <span class="w-9 text-center text-sm font-semibold text-maroon">${i.qty}</span>
              <button data-inc="${i.id}" class="w-8 h-8 flex items-center justify-center text-maroon hover:bg-cream-dark transition">+</button>
            </div>
            <button data-del="${i.id}" class="text-xs text-red-500 hover:text-red-600 font-medium inline-flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>Remove</button>
          </div>
        </div>
        <div class="text-right shrink-0"><p class="font-serif text-lg font-bold text-maroon">${A.money(i.line)}</p></div>
      </div>`).join('');

    const subtotal = A.cart.subtotal();
    const ship = A.cart.shippingFee();
    const total = A.cart.total();

    root.innerHTML = `
    <div class="grid lg:grid-cols-[1fr_360px] gap-8 items-start">
      <div class="card overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3 bg-cream-dark/40 border-b border-gold/10">
          <span class="text-sm font-semibold text-maroon">${items.length} item${items.length>1?'s':''} in cart</span>
          <button id="clear" class="text-xs text-stone-400 hover:text-red-500 transition">Clear cart</button>
        </div>
        ${rows}
      </div>
      <div class="card p-6 lg:sticky lg:top-28">
        <h3 class="font-serif text-xl text-maroon mb-4">Order Summary</h3>
        <div class="space-y-3 text-sm">
          <div class="flex justify-between"><span class="text-stone-500">Subtotal</span><span class="font-medium text-maroon">${A.money(subtotal)}</span></div>
          <div class="flex justify-between"><span class="text-stone-500">Shipping</span><span class="font-medium ${ship===0?'text-green-600':'text-maroon'}">${ship===0?'FREE':A.money(ship)}</span></div>
          ${ship>0?`<p class="text-xs text-stone-400">Add ${A.money(2000-subtotal)} more for free shipping</p>`:''}
          <div class="border-t border-gold/15 pt-3 flex justify-between items-center"><span class="font-semibold text-maroon">Total</span><span class="font-serif text-2xl font-bold text-maroon">${A.money(total)}</span></div>
        </div>
        <div class="mt-5 flex gap-2">
          <input placeholder="Coupon code" class="field"><button id="coupon" class="btn-outline px-4 py-2.5 shrink-0">Apply</button>
        </div>
        <a href="checkout.html" class="btn-maroon w-full mt-4 py-3.5">PROCEED TO CHECKOUT</a>
        <a href="shop.html" class="block text-center text-sm text-maroon hover:text-gold-dark mt-3 transition">Continue Shopping</a>
      </div>
    </div>`;

    root.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => { const id=b.getAttribute('data-inc'); A.cart.setQty(id, A.cart.items().find(x=>x.id===id).qty+1); render(); }));
    root.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => { const id=b.getAttribute('data-dec'); const c=A.cart.items().find(x=>x.id===id).qty; if(c>1){A.cart.setQty(id,c-1);render();} }));
    root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { A.cart.remove(b.getAttribute('data-del')); A.toast('Removed from cart'); render(); }));
    document.getElementById('clear').addEventListener('click', () => { A.cart.clear(); render(); });
    document.getElementById('coupon').addEventListener('click', () => A.toast('Coupons apply at checkout on the live store', 'error'));
  }
  render();
};
</script>
</body>
</html>
