<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop · Ananya</title>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=playfair-display:400,500,600,700|poppins:300,400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/js/ananya.js"></script>
</head>
<body>
<div id="site-header"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <!-- breadcrumb + title -->
  <nav class="text-xs text-stone-400 mb-2"><a href="index.html" class="hover:text-gold-dark">Home</a> <span class="mx-1">/</span> <span id="crumb" class="text-maroon">Shop</span></nav>
  <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
    <div><h1 id="shop-title" class="section-title">All Products</h1><span class="mt-2 inline-block w-20 h-0.5 bg-gold rounded"></span></div>
    <div class="flex items-center gap-3">
      <span id="result-count" class="text-sm text-stone-500"></span>
      <select id="sort" class="field w-auto py-2">
        <option value="featured">Sort: Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name">Name: A–Z</option>
        <option value="rating">Top Rated</option>
      </select>
      <button id="filter-toggle" class="lg:hidden btn-outline py-2 px-4">Filters</button>
    </div>
  </div>

  <div class="grid lg:grid-cols-[260px_1fr] gap-8">
    <!-- filters -->
    <aside id="filters" class="hidden lg:block space-y-6">
      <div class="card p-5">
        <div class="relative">
          <input id="f-search" type="text" placeholder="Search products..." class="field pr-10">
          <svg class="w-4 h-4 absolute right-3 top-3 text-stone-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
      </div>
      <div class="card p-5">
        <h3 class="font-serif text-lg text-maroon mb-3">Categories</h3>
        <div id="f-categories" class="space-y-1.5 text-sm"></div>
      </div>
      <div class="card p-5">
        <h3 class="font-serif text-lg text-maroon mb-4">Price Range</h3>
        <div class="flex items-center justify-between text-xs text-stone-500 mb-2"><span>₹0</span><span id="price-out" class="font-semibold text-maroon"></span></div>
        <input id="f-price" type="range" min="0" max="25000" step="500" value="25000" class="w-full accent-gold">
        <div class="mt-4 grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="f-sale accent-maroon"> On Sale</label>
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="f-stock accent-maroon"> In Stock</label>
        </div>
      </div>
      <button id="f-reset" class="btn-outline w-full py-2.5">Reset Filters</button>
    </aside>

    <!-- grid -->
    <section>
      <div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-5"></div>
      <div id="empty" class="hidden text-center py-20">
        <div class="w-16 h-16 rounded-full bg-gold/10 mx-auto flex items-center justify-center text-gold-dark mb-4"><svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>
        <p class="font-serif text-xl text-maroon">No products found</p>
        <p class="text-sm text-stone-500 mt-1">Try adjusting your filters or search.</p>
      </div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script>
window.PAGE_INIT = function () {
  const A = window.Ananya;
  const state = {
    cat: A.qs('cat') || 'all',
    q: A.qs('q') || '',
    sale: A.qs('sale') === '1',
    stock: false,
    price: 25000,
    sort: 'featured',
  };

  // build category filter
  const cats = A.catalog.categories();
  const catBox = document.getElementById('f-categories');
  const renderCatFilter = () => {
    catBox.innerHTML = [{ slug: 'all', name: 'All Products' }].concat(cats).map(c => {
      const active = state.cat === c.slug;
      const count = c.slug === 'all' ? A.catalog.products().length : A.catalog.byCategory((cats.find(x=>x.slug===c.slug)||{}).id).length;
      return `<button data-cat="${c.slug}" class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg transition ${active ? 'bg-maroon text-cream' : 'hover:bg-cream-dark text-stone-600'}">
        <span>${A.esc(c.name)}</span><span class="text-xs ${active ? 'text-cream/70' : 'text-stone-400'}">${count}</span></button>`;
    }).join('');
    catBox.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => { state.cat = b.getAttribute('data-cat'); apply(); }));
  };

  const searchEl = document.getElementById('f-search');
  searchEl.value = state.q;
  const priceEl = document.getElementById('f-price');
  const priceOut = document.getElementById('price-out');
  const sortEl = document.getElementById('sort');

  searchEl.addEventListener('input', () => { state.q = searchEl.value; apply(); });
  priceEl.addEventListener('input', () => { state.price = +priceEl.value; priceOut.textContent = A.money(state.price); apply(); });
  sortEl.addEventListener('change', () => { state.sort = sortEl.value; apply(); });
  document.querySelector('.f-sale').addEventListener('change', e => { state.sale = e.target.checked; apply(); });
  document.querySelector('.f-stock').addEventListener('change', e => { state.stock = e.target.checked; apply(); });
  document.querySelector('.f-sale').checked = state.sale;
  document.getElementById('f-reset').addEventListener('click', () => {
    state.cat = 'all'; state.q = ''; state.sale = false; state.stock = false; state.price = 25000; state.sort = 'featured';
    searchEl.value = ''; priceEl.value = 25000; sortEl.value = 'featured';
    document.querySelector('.f-sale').checked = false; document.querySelector('.f-stock').checked = false;
    apply();
  });
  document.getElementById('filter-toggle').addEventListener('click', () => document.getElementById('filters').classList.toggle('hidden'));

  function apply() {
    let list = A.catalog.products();
    // category
    if (state.cat !== 'all') { const c = cats.find(x => x.slug === state.cat); if (c) list = list.filter(p => p.categoryId === c.id); }
    // search
    if (state.q.trim()) { const q = state.q.toLowerCase(); list = list.filter(p => p.name.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q)); }
    // price
    list = list.filter(p => A.catalog.effectivePrice(p) <= state.price);
    // sale / stock
    if (state.sale) list = list.filter(p => p.salePrice != null && p.salePrice < p.price);
    if (state.stock) list = list.filter(p => p.stock > 0);
    // sort
    const price = p => A.catalog.effectivePrice(p);
    if (state.sort === 'price-asc') list.sort((a,b) => price(a)-price(b));
    else if (state.sort === 'price-desc') list.sort((a,b) => price(b)-price(a));
    else if (state.sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
    else if (state.sort === 'rating') list.sort((a,b) => b.rating-a.rating);
    else list.sort((a,b) => (b.featured?1:0)-(a.featured?1:0));

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    grid.innerHTML = list.map(A.productCard).join('');
    empty.classList.toggle('hidden', list.length > 0);
    document.getElementById('result-count').textContent = list.length + ' item' + (list.length===1?'':'s');
    // title + crumb
    const activeCat = cats.find(c => c.slug === state.cat);
    const title = state.sale ? 'On Sale' : (activeCat ? activeCat.name : 'All Products');
    document.getElementById('shop-title').textContent = title;
    document.getElementById('crumb').textContent = title;
    renderCatFilter();
  }

  priceOut.textContent = A.money(state.price);
  renderCatFilter();
  apply();
};
</script>
</body>
</html>
